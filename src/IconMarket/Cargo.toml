[package]
name = "icon-market"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
# Decodes webhook signatures (FR-LINE-02); the version reqwest already uses
base64 = "0.23.1"
# SeaORM's chrono support turns on `clock`; its `Local` reads TZ and /etc/localtime, so clippy.toml
# forbids it: config comes only from the file (CFG-02)
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
# Compiles the tz database in, so `app.timeZone` is checked without reading zoneinfo files
chrono-tz = "0.10.4"
# Random IDs of 128 bits for images and pending actions (NFR-SEC-04)
getrandom = "0.4.3"
# Webhook signatures: HMAC-SHA256 of the body with the channel secret, compared in constant time
# (FR-LINE-02)
hmac = "0.13.0"
# Decodes uploads and re-encodes them as JPEG without metadata (FR-PROD-04, NFR-SEC-06). Only the
# two formats accepted, and no rayon: processing runs on the blocking pool, two at a time
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
# Encodes the PromptPay QR code (FR-PAY-04). No default features: it only lays out the modules,
# which `image` draws and encodes as a PNG
qrcode = { version = "0.14.1", default-features = false }
# Outbound HTTPS to the LINE API and the AI providers. No default features: `system-proxy` reads
# the OS proxy settings and the default verifier reads SSL_CERT_FILE; TLS comes from the `rustls`
# config below and the clients call `no_proxy`, so config comes only from the file (CFG-02)
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
# Outbound TLS (LINE, AI providers): ring with the compiled-in roots, as sqlx's `tls-rustls-ring-webpki`
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# Code-first ORM (CON-04): the entity models generate the schema (MIG-01). Its TLS comes from sqlx.
# `schema-sync` brings the schema up to date at startup (MIG-02); it is experimental and not
# strictly additive, so `persistence::migrate` guards it (MIG-03)
sea-orm = { version = "2.0.4", default-features = false, features = ["macros", "runtime-tokio", "schema-sync", "sqlx-postgres", "with-chrono", "with-json", "with-rust_decimal", "with-uuid"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Fingerprints the schema the models generate (MIG-09)
sha2 = { version = "0.11.1", default-features = false }
# No `macros`: `query!` reads DATABASE_URL at build time, and config comes only from the file (CFG-02)
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls-ring-webpki"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
toml = "1.1.8"
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
# No `ansi` (it reads NO_COLOR) and no `env-filter` (it reads RUST_LOG): config comes only from the file (CFG-02)
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "smallvec", "std", "tracing-log"] }
url = "2.5.8"
# Root certificates for outbound HTTPS, compiled in rather than read from the system
webpki-roots = "1.0.11"

[dev-dependencies]
# Reads back the PromptPay QR codes drawn, so tests check what a banking app scans (FR-PAY-04)
rqrr = { version = "0.11.0", default-features = false }
tempfile = "3.27.0"
# A throwaway PostgreSQL per database test; needs Docker
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
tokio = { version = "1.54.1", features = ["full", "test-util"] }
tower = { version = "0.5", features = ["util"] }
