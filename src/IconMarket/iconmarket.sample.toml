# IconMarket configuration: the only source of configuration, credentials included (SRS §6).
#
# Copy this file to iconmarket.toml in the working directory, or pass another path as
# the first command-line argument. The real file holds credentials in plain text, so
# keep it out of version control and readable only by the service account.
#
# Every key is listed here with its default. Keys marked "Required" have none; any other
# key may be left out. An empty string is the same as leaving a key out. Unknown keys
# are reported as warnings at startup. Changes take effect on restart.

[app]
# Name shown in messages
name = "IconMarket"
# Required. Public HTTPS base URL for the webhook and image links
baseUrl = "https://iconmarket.example.com"
# HTTP listen port
listenPort = 8080
# Business time zone, as an IANA name
timeZone = "Asia/Bangkok"
# The bot's polite particle: ค่ะ or ครับ
politeParticle = "ค่ะ"

[village]
# Required
name = "หมู่บ้านไอคอน"
# Offered as Quick Replies, e.g. ["ซอย 1", "ซอย 2", "หมู่ 5"]
zones = []
# Code required to register, typed once after accepting the privacy notice; empty turns it
# off. 5 wrong codes within an hour block further attempts for an hour
joinCode = ""
# Contact text shown in help
adminContact = ""

[line]
# Required. Verifies webhook signatures
channelSecret = "change-me"
# Required. Messaging API access token
channelAccessToken = "change-me"
# Group for the daily digest: C followed by 32 hex digits. Type #groupid in the group
# to get it. Required when notification.groupDigest is true
villageGroupId = ""

[line.richMenu]
# Create or update rich menus at startup. When false, the IconMarket menus already at LINE are
# linked as they are
autoProvision = true

[ai]
# Master switch. When true, provider, model and apiKey are required
enabled = true
# claude, gemini, gpt, grok or mock. Changing it, or the model, needs only a restart. What each
# takes, and so which features it can serve (the others are turned off with a warning):
#   claude  images                 (no voice messages)
#   gemini  images and voice
#   gpt     images                 (no voice messages)
#   grok    images, except grok-build and grok-code models (no voice messages)
provider = "claude"
# Model name at that provider, e.g. claude-opus-5, gemini-3.8-flash, gpt-6-astra, grok-4.7
model = "change-me"
# Not needed for mock
apiKey = "change-me"
# Endpoint override, e.g. a proxy; empty uses the provider's own. Written as each provider's
# SDKs take it:
#   claude  https://api.anthropic.com
#   gemini  https://generativelanguage.googleapis.com
#   gpt     https://api.openai.com/v1
#   grok    https://api.x.ai/v1
baseUrl = ""
# Per request
timeoutSeconds = 20
# The visible answer. Models that think get room for their thinking on top
maxOutputTokens = 1024
# 0 to 2. Models that reason take none, and keep their own
temperature = 0.3
# Conversation turns sent as context
historyTurns = 10
# Log prompts and responses
logContent = false

[ai.features]
# Free-text understanding (FR-AI-01)
assistant = true
# Listing assistant (FR-PROD-02)
listing = true
# AI moderation (FR-PROD-09)
moderation = true
# Slip reading (FR-PAY-06)
slipReading = false
# Voice messages (FR-AI-15)
voice = false
# Visual search (FR-SRCH-10)
visualSearch = false

[ai.limits]
perUserDailyCalls = 50
globalDailyCalls = 2000

[ai.fallback]
# Secondary provider, tried when the primary fails or times out (FR-AIP-06); empty
# turns it off. When set, model and apiKey are required (apiKey not for mock)
provider = ""
model = ""
apiKey = ""

[database]
# Required. PostgreSQL server
host = "localhost"
port = 5432
# Required
name = "iconmarket"
# Required. Needs rights to create and alter objects in its schema (MIG-08), as the schema
# updates itself at every startup. Since PostgreSQL 15 only the database owner may create
# in `public`, so make this user the owner:
#   CREATE DATABASE iconmarket OWNER iconmarket;
# or grant it on an existing database:
#   GRANT CREATE ON SCHEMA public TO iconmarket;
user = "iconmarket"
# Required
password = "change-me"
# disable, allow, prefer, require, verify-ca or verify-full
sslMode = "prefer"
# Connection pool size
maxConnections = 10

[shop]
# Admin approval for new shops
requireApproval = true

[order]
# Auto-expire unanswered orders
pendingTimeoutMinutes = 60

[payment]
# Allowed payment methods: cash, promptpay
methods = ["cash", "promptpay"]

[notification]
newOrderToSeller = true
orderStatusToBuyer = true
adminAlerts = true
# Daily summary (FR-NOT-06), sent at dailySummaryTime (HH:mm): one push a day to each
# seller who had an order placed or completed that day, counted against the push quota
dailySummary = false
dailySummaryTime = "20:00"
# Village group digest (FR-NOT-07), posted at groupDigestTime (HH:mm)
groupDigest = false
groupDigestTime = "07:00"

[image]
maxUploadMB = 10
# Longest side after processing
maxDimensionPx = 1024
maxPerProduct = 3
# Lifetime of slip-image links
slipLinkHours = 24

[session]
# Guided-flow inactivity timeout
timeoutMinutes = 15
# Lifetime of confirmation buttons
pendingActionMinutes = 60

[limits]
# Per-user rate limit
messagesPerUserPerMinute = 20

[catalog]
# Seeded on first start only
defaultCategories = [
    "อาหาร",
    "ขนม/ของหวาน",
    "เครื่องดื่ม",
    "ผัก/ผลไม้",
    "เนื้อสัตว์/ไข่",
    "ของใช้ในบ้าน",
    "ต้นไม้/การเกษตร",
    "งานฝีมือ",
    "บริการ",
    "อื่นๆ",
]
# Keyword moderation (FR-PROD-09): new or edited product and shop text containing one of these,
# whatever its case or spacing, is held for an admin to review
prohibitedKeywords = []

[privacy]
# Required. Change it whenever the notice changes, including a change of ai.provider, which
# the notice names: everyone is then asked to accept it again
noticeVersion = "1"
# Required, at most 3000 characters. Notice shown before consent, e.g. who runs the market and
# how to reach them. The system adds what is collected and why, how long it is kept, who
# receives it (LINE, the AI provider by name, the other party of an order) and the user's rights
noticeText = "change-me"
# Optional link to the full notice
noticeUrl = ""

[admin]
# Required, at least one. Admin LINE user IDs: U followed by 32 hex digits
lineUserIds = ["U00000000000000000000000000000000"]

[logging]
# debug, info, warn or error
level = "info"
# Log file path; empty means standard output
file = ""

[retention]
webhookEventDays = 14
aiMessageDays = 30
aiCallLogDays = 90
pushLogDays = 90
slipDays = 90
deletedImageDays = 30
auditLogDays = 365
